name: Quality and application safeguards

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.12", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: git diff --exit-code -- src/applicator/static
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm audit --audit-level=low
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          enable-cache: true
      - run: uv python install ${{ matrix.python }}
      - run: uv sync --frozen --extra dev --python ${{ matrix.python }}
      - run: uv run python -m playwright install --with-deps chromium
      - run: uv run python -m ruff check .
      - run: uv run python -m ruff format --check .
      - run: uv run python scripts/check_repository_hygiene.py
      - run: uv run python -m mypy src
      - run: uv run python -m pytest
      - run: uv run python scripts/check_backend_coverage.py
      - run: npm run coverage:browser
      - run: uv run python scripts/benchmark_local.py
      - run: uv run python -m pip_audit
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: coverage-${{ matrix.os }}-${{ matrix.python }}
          path: |
            coverage.xml
            test-results/backend-coverage.json
            test-results/local-benchmark.json
            test-results/frontend-report
            test-results/unit-coverage

name: Quality and application safeguards

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.12", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run build:css
      - run: git diff --exit-code -- src/applicator/static/style.css
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm audit --audit-level=low
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv python install ${{ matrix.python }}
      - run: uv sync --frozen --extra dev --python ${{ matrix.python }}
      - run: uv run python -m playwright install --with-deps chromium
      - run: uv run python -m ruff check .
      - run: uv run python scripts/check_repository_hygiene.py
      - run: uv run python -m mypy src
      - run: uv run python -m pytest
      - run: npm run coverage:browser
      - run: uv run python -m pip_audit
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-${{ matrix.os }}-${{ matrix.python }}
          path: |
            coverage.xml
            test-results/frontend-report
